spring.application.name=smartlibrary

# MongoDB. Por defecto usa un servidor local; para Atlas define la variable
# de entorno MONGODB_URI (no subas usuarios ni contrasenas al repositorio).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartlibrary}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartlibrary}
